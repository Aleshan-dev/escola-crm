name: Deploy to Vercel (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_42xH34dqOWlftoxiPh3Toisc
  VERCEL_PROJECT_ID: prj_heNVdN9ZLtu7dRfMogBurPVc6ylb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production (build on Vercel)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
