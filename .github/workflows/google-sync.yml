name: Google Calendar Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar com Google Calendar
        run: |
          RESPONSE=$(curl -s -o /tmp/r.txt -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://escola-crm.vercel.app/api/cron/google-sync)
          echo "HTTP Status: $RESPONSE"
          cat /tmp/r.txt
          if [ "$RESPONSE" != "200" ]; then
            exit 1
          fi
