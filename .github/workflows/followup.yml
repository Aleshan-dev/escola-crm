name: Follow-up automatico da Sara

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  followup:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar follow-up
        run: |
          RESPONSE=$(curl -s -o /tmp/r.txt -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://escola-crm.vercel.app/api/cron/followup)
          echo "HTTP Status: $RESPONSE"
          cat /tmp/r.txt
          if [ "$RESPONSE" != "200" ]; then
            exit 1
          fi
