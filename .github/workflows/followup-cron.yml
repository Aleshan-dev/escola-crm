name: Cron Sara (follow-up)

# ADR-004: agenda o follow-up automático da Sara via GitHub Actions, contornando
# o limite de cron diário do plano Vercel Hobby.
# ADR-006: o sync do Google Calendar SAIU daqui — agora é por push notification
# (webhook), não polling. Ver .github/workflows/google-daily.yml para a renovação
# do canal + rede de segurança diária.
# DESATIVADO (agendamento): o cron agora roda 100% na Vercel (ver vercel.json),
# que não consome minutos do GitHub Actions. Mantido só o disparo manual como
# rede de segurança. Requer o secret CRON_SECRET se for disparado manualmente.
on:
  workflow_dispatch: {}

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Follow-up automático da Sara
        run: |
          code=$(curl -sS -o /tmp/followup.txt -w "%{http_code}" -X GET \
            "https://escola-crm.vercel.app/api/cron/followup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "followup -> HTTP $code"
          cat /tmp/followup.txt || true
          test "$code" = "200"
