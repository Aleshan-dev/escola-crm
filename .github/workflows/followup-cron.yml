name: Cron Sara (follow-up + Google sync)

# ADR-004: agenda o follow-up automático da Sara (e o sync do Google Calendar)
# via GitHub Actions, contornando o limite de cron diário do plano Vercel Hobby.
# Requer o secret CRON_SECRET no repositório (mesmo valor que os endpoints validam).
# Cada passo FALHA se a resposta não for HTTP 200 — o GitHub notifica o dono por e-mail.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Follow-up automático da Sara
        run: |
          code=$(curl -sS -o /tmp/followup.txt -w "%{http_code}" -X GET \
            "https://escola-crm.vercel.app/api/cron/followup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "followup -> HTTP $code"
          cat /tmp/followup.txt || true
          test "$code" = "200"

      - name: Sincronizar Google Calendar
        if: always() # roda mesmo se o passo anterior falhar
        run: |
          code=$(curl -sS -o /tmp/gsync.txt -w "%{http_code}" -X GET \
            "https://escola-crm.vercel.app/api/cron/google-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "google-sync -> HTTP $code"
          cat /tmp/gsync.txt || true
          test "$code" = "200"
