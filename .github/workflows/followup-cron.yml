name: Cron Sara (follow-up + Google sync)

# ADR-004: agenda o follow-up automático da Sara (e o sync do Google Calendar)
# via GitHub Actions, contornando o limite de cron diário do plano Vercel Hobby.
# Requer o secret CRON_SECRET no repositório (mesmo valor que os endpoints validam).
on:
  schedule:
    # A cada 20 minutos. O horário comercial é filtrado dentro do endpoint (fuso de Acre).
    - cron: '*/20 * * * *'
  workflow_dispatch: {} # permite disparo manual pela aba Actions

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Follow-up automático da Sara
        run: |
          curl -sS -X GET "https://escola-crm.vercel.app/api/cron/followup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nfollowup -> HTTP %{http_code}\n"

      - name: Sincronizar Google Calendar
        run: |
          curl -sS -X GET "https://escola-crm.vercel.app/api/cron/google-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\ngoogle-sync -> HTTP %{http_code}\n"
